<!DOCTYPE html>
<html lang="pt-BR" data-i18n-page="404">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Página não encontrada | Mancia Studios</title>
  <meta name="description" content="A página solicitada não foi encontrada em manciastudios.com." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#080B12" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
  <link rel="stylesheet" href="/assets/css/global.css?v=3.2.0" />
  <style>
    .err-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px;
      position: relative;
      overflow: hidden;
    }
    .err-card {
      max-width: 520px;
      background: var(--bg-surface);
      backdrop-filter: var(--blur-glass);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 48px 36px;
      position: relative;
      z-index: 2;
    }
    .err-code {
      font-family: var(--font-display);
      font-size: clamp(64px, 12vw, 96px);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 16px 0 12px;
    }
    .err-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .err-desc {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 28px;
      line-height: 1.65;
    }
    .err-top {
      position: fixed;
      top: 20px;
      right: 24px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="err-top">
    <div class="lang-switch" id="lang-switch" role="switch" aria-checked="false" onclick="toggleLang()" data-lang="pt" tabindex="0" aria-label="Idioma: Português — clique para English">
      <span class="lang-opt">PT</span>
      <span class="lang-opt">EN</span>
      <div class="lang-pill"></div>
    </div>
  </div>

  <main class="err-wrap">
    <div class="err-card">
      <span class="badge badge-cyan" data-i18n="err404.badge">Erro 404</span>
      <div class="err-code" aria-hidden="true">404</div>
      <h1 class="err-title" data-i18n="err404.title">Página não encontrada</h1>
      <p class="err-desc" data-i18n="err404.desc">
        O endereço acessado não existe ou foi movido. Utilize o botão abaixo para retornar à página principal da Mancia Studios.
      </p>
      <a href="/" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        <span data-i18n="err404.cta">Voltar ao início</span>
      </a>
    </div>
  </main>

  <script src="/assets/js/translations.js?v=3.2.0"></script>
  <script src="/assets/js/i18n.js?v=3.2.0"></script>
</body>
</html>
