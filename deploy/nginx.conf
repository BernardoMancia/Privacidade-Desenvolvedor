server {
    listen 80;
    listen [::]:80;
    server_name manciastudios.com www.manciastudios.com;

    root /home/__VPS_USER__/manciastudios/public;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /home/__VPS_USER__/manciastudios/public;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name manciastudios.com www.manciastudios.com;

    ssl_certificate     /etc/letsencrypt/live/manciastudios.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manciastudios.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/__VPS_USER__/manciastudios/public;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Central Monitoring Healthcheck Endpoint
    location = /health {
        default_type application/json;
        access_log off;
        return 200 '{"status":"ok","app_name":"manciastudios-site","version":"v3.2.0"}';
    }

    # Allow ACME renewal challenges
    location ^~ /.well-known/acme-challenge/ {
        root /home/__VPS_USER__/manciastudios/public;
        allow all;
    }

    # Block all hidden files and directories (.git, .env, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block internal/script/archive extensions if ever placed in public/
    location ~* \.(md|sh|conf|zip|tar|gz|bak|sql|db|py|env)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|svg|ico|woff|woff2|ttf|otf|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /404.html {
        internal;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               image/svg+xml font/woff2;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self';" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    error_page 404 /404.html;
    error_page 500 502 503 504 /404.html;

    access_log /var/log/nginx/manciastudios_access.log;
    error_log /var/log/nginx/manciastudios_error.log;
}
